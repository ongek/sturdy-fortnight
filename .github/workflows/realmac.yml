name: Build MilkyWay macOS Native

on:
  push:
  workflow_dispatch:

# ==============================================================================
# M4 E-Core 全域共有パラメータ（YAMLの共通定義として集約）
# ==============================================================================
env:
  # -mllvm -prefer-vector-width=128 を削除し、-mcpu=apple-m4 に任せる形に修正
  ECORE_OPT: >-
    -O3
    -mcpu=apple-m4
    -flto=thin
    -falign-functions=128
    -falign-loops=32
    -mllvm -align-all-nofallthru-blocks=32
    -mllvm -inline-threshold=350
    -mllvm -unroll-threshold=40
    -ffp-contract=fast
    -fno-math-errno
    -fvectorize
    -fslp-vectorize
    -fomit-frame-pointer
    -mmacosx-version-min=15.0

  # 2. OpenMP / M4 E-Core ランタイム制御（実行時環境変数の埋め込み準備）
  # ※実行時スクリプト等から参照できるよう定義
  OMP_NUM_THREADS: "4"
  OMP_PLACES: "cores"
  OMP_PROC_BIND: "close"
  KMP_BLOCKTIME: "0"

jobs:
  build-test:
    runs-on: xcode-27
    steps:
      - name: Show System Info & Clang Version
        run: |
          uname -a
          arch
          clang --version

      - name: Install Dependencies
        run: |
          brew install libomp cmake autoconf automake libtool

      - name: Configure Git for Legacy Submodules
        run: |
          git config --global url."https://".insteadOf git://

      - name: Clone MilkyWay@home Source
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/Milkyway-at-home/milkywayathome_client.git source

      - name: Build BOINC Libraries (arm64)
        run: |
          cd source/boinc/boinc
          mkdir -p "$HOME/bin"
          ln -sf "$(which glibtoolize)" "$HOME/bin/libtoolize"
          export PATH="$HOME/bin:$PATH"

          # macOS SDKパスの取得
          SYSROOT=$(xcrun --show-sdk-path)

          ./_autosetup

          # configure 時は標準的なフラグのみ指定してコンパイラチェックの失敗を防ぐ
          ./configure \
            --disable-server \
            --disable-client \
            --disable-manager \
            --enable-libraries \
            --disable-shared \
            --enable-static \
            CC="clang" \
            CXX="clang++" \
            CFLAGS="-O3 -arch arm64 -isysroot $SYSROOT -mmacosx-version-min=15.0 -Wno-error" \
            CXXFLAGS="-O3 -arch arm64 -isysroot $SYSROOT -mmacosx-version-min=15.0 -Wno-error"

          # 本体のビルド時に ECORE_OPT (ThinLTOやLLVMオプション等) を注入してビルド
          make -C lib -j$(sysctl -n hw.ncpu) CFLAGS="$ECORE_OPT -Wno-error" CXXFLAGS="$ECORE_OPT -Wno-error"
          make -C api -j$(sysctl -n hw.ncpu) CFLAGS="$ECORE_OPT -Wno-error" CXXFLAGS="$ECORE_OPT -Wno-error"

      - name: Configure & Patch MilkyWay CMake (M4 E-Core Specialized)
        run: |
          cd source
          sed -i '' 's/cmake_minimum_required(VERSION [0-9.]*)/cmake_minimum_required(VERSION 3.5)/g' CMakeLists.txt
          sed -i '' 's/message(FATAL_ERROR.*OS X SDK.*/# bypass ancient sdk check/g' cmake_modules/SpecialLibs.cmake

          mkdir -p build && cd build
          SYSROOT=$(xcrun --show-sdk-path)
          CLANG_PERMISSIVE="-Wno-incompatible-function-pointer-types -Wno-int-conversion -Wno-implicit-function-declaration -Wno-deprecated-non-prototype -Wno-error"

          cmake .. \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_POLICY_DEFAULT_CMP0074=NEW \
            -DCMAKE_OSX_SYSROOT="$SYSROOT" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="15.0" \
            -DBOINC_DIR=../boinc/boinc \
            -DBOINC_APPLICATION=ON \
            -DNBODY=ON \
            -DSEPARATION=OFF \
            -DNBODY_OPENMP=ON \
            -DNBODY_GL=OFF \
            -DOpenMP_ROOT=/opt/homebrew/opt/libomp \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="$ECORE_OPT -I/opt/homebrew/opt/libomp/include $CLANG_PERMISSIVE" \
            -DCMAKE_CXX_FLAGS="$ECORE_OPT -I/opt/homebrew/opt/libomp/include $CLANG_PERMISSIVE"

      - name: Compile & Link N-body (Static libomp & E-Core Tuned)
        run: |
          cd source/build

          make -j$(sysctl -n hw.ncpu) || true

          TARGET_LINK="nbody/CMakeFiles/milkyway_nbody.dir/link.txt"
          if [ -f "$TARGET_LINK" ]; then
            echo "=== Patching $TARGET_LINK for E-Core ==="
            sed -i '' 's/-Wl,--start-group//g; s/-Wl,--end-group//g; s/--start-group//g; s/--end-group//g' "$TARGET_LINK"
            sed -i '' 's/-libstdc++//g; s/-static//g' "$TARGET_LINK"
            sed -i '' 's/-mmacosx-version-min=[0-9.]*/-mmacosx-version-min=15.0/g' "$TARGET_LINK"
            
            # dylibの代わりに「静的ライブラリ（libomp.a）」を直接結合
            sed -i '' 's|$| -flto=thin /opt/homebrew/opt/libomp/lib/libomp.a|' "$TARGET_LINK"

            echo "=== Executing E-Core Link Command ==="
            (cd nbody && bash -c "$(cat CMakeFiles/milkyway_nbody.dir/link.txt)")
          fi

          echo "=== Built Binaries ==="
          ls -lh bin/* || ls -lh nbody/* || ls -lh *milkyway* || true
          file bin/milkyway_nbody || file nbody/milkyway_nbody || true

          # 依存関係の確認（libomp.dylib が消えて完全自己完結しているか確認）
          echo "=== Dynamic Library Dependencies ==="
          otool -L bin/milkyway_nbody || true

      - name: Upload E-Core Binary
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: milkyway_nbody_m4_ecore
          path: |
            source/build/bin/
            source/build/nbody/
