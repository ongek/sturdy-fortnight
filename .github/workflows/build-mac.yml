name: Build MilkyWay macOS Native

on:
  workflow_dispatch: # GitHubのWeb画面から手動で実行できるようにする

jobs:
  build-test:
    runs-on: macos-15 # 最新のApple Silicon (arm64) ランナー
    steps:
      - name: Show System Info & Clang Version
        run: |
          uname -a
          arch
          clang --version

      - name: Install Dependencies
        run: |
          brew install libomp cmake

      - name: Configure Git for Legacy Submodules
        run: |
          # 地雷2対策: 古い git:// を強制的に https:// に書き換える
          git config --global url."https://".insteadOf git://

      - name: Clone MilkyWay@home Source
        run: |
          # 地雷1対策: サブモジュール（crlibm）も含めて確実に再帰取得する
          git clone --depth 1 --recurse-submodules https://github.com/Milkyway-at-home/milkywayathome_client.git source
          cd source
          git submodule status
