name: Build MilkyWay macOS Native

on:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - name: Show System Info & Clang Version
        run: |
          uname -a
          arch
          clang --version

      - name: Install Dependencies
        run: |
          brew install libomp cmake autoconf automake libtool

      - name: Configure Git for Legacy Submodules
        run: |
          git config --global url."https://".insteadOf git://

      - name: Clone MilkyWay@home Source
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/Milkyway-at-home/milkywayathome_client.git source

      - name: Build BOINC Libraries (arm64)
        run: |
          cd source/boinc/boinc
          
          # 【脳内シミュレーション対策】
          # 1. macOS特有の glibtoolize を環境変数で明示
          export LIBTOOLIZE=glibtoolize
          # 2. GNUツール群のプレフィックスなしパスを最優先に通す
          export PATH="/opt/homebrew/opt/libtool/libexec/gnubin:$PATH"

          # スクリプト生成
          ./_autosetup
          
          # 最小限のライブラリ構成（警告で止まらないようにフラグを保護）
          ./configure \
            --disable-server \
            --disable-client \
            --disable-manager \
            --enable-libraries \
            --enable-boinczip \
            --disable-shared \
            --enable-static \
            CFLAGS="-O3 -arch arm64 -Wno-error" \
            CXXFLAGS="-O3 -arch arm64 -Wno-error"
          
          # 並列ビルド
          make -j$(sysctl -n hw.ncpu)
          
          # 成果物の確認（これが通ればBOINCライブラリは完全制覇）
          echo "=== Successfully Built BOINC Libraries ==="
          ls -lh lib/.libs/libboinc.a api/.libs/libboinc_api.a || ls -lh lib/libboinc.a api/libboinc_api.a
