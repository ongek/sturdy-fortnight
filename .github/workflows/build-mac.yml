name: Build MilkyWay A17 Pro iOS Native (Apple Native GCD)

on:
  push:
  workflow_dispatch:

jobs:
  build-a17pro:
    runs-on: xcode-27
    steps:
      - name: Show System Info & Clang Version
        run: |
          uname -a
          clang --version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install Dependencies
        run: |
          brew install cmake autoconf automake libtool

      - name: Configure Git for Legacy Submodules
        run: |
          git config --global url."https://".insteadOf git://

      - name: Clone MilkyWay@home Source
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/Milkyway-at-home/milkywayathome_client.git source

      - name: Build BOINC Libraries (iOS arm64 tuned for A17 Pro)
        run: |
          cd source/boinc/boinc
          mkdir -p "$HOME/bin"
          ln -sf "$(which glibtoolize)" "$HOME/bin/libtoolize"
          export PATH="$HOME/bin:$PATH"
          
          python3 -c '
          import os, re
          dummy_code = """
          #include <stdio.h>
          #include <stdlib.h>
          int callPosixSpawn(const char* cmd) { (void)cmd; return -1; }
          #ifdef __cplusplus
          extern "C" {
          #endif
              void PrintBacktrace(void) {}
              int compareOSVersionTo(int major, int minor, int bugFix) { 
                  (void)major; (void)minor; (void)bugFix; return 0; 
              }
          #ifdef __cplusplus
          }
          #endif
          """
          for root, dirs, files in os.walk("."):
              for file in files:
                  fpath = os.path.join(root, file)
                  if "/mac/" in fpath or fpath.startswith("./mac/"):
                      if file.endswith((".cpp", ".c", ".m", ".mm")):
                          with open(fpath, "w", encoding="utf-8") as f:
                              f.write(dummy_code)
          if os.path.exists("lib/procinfo_mac.cpp"):
              with open("lib/procinfo_mac.cpp", "a", encoding="utf-8") as f:
                  f.write("\nchar *brandName[5] = {(char*)\"BOINC\", (char*)\"BOINC\", (char*)\"BOINC\", (char*)\"BOINC\", (char*)\"BOINC\"};\n")
          
          if os.path.exists("lib/diagnostics.cpp"):
              with open("lib/diagnostics.cpp", "r", encoding="utf-8", errors="ignore") as f:
                  d_content = f.read()
              d_content = d_content.replace("PrintBacktrace();", "// PrintBacktrace();")
              with open("lib/diagnostics.cpp", "w", encoding="utf-8") as f:
                  f.write(d_content)
          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.endswith((".cpp", ".c", ".h")):
                      fpath = os.path.join(root, file)
                      with open(fpath, "r", encoding="utf-8", errors="ignore") as f:
                          c = f.read()
                      c = re.sub(r"#\s*include\s*<Carbon/", "// #include <Carbon/", c)
                      c = re.sub(r"#\s*include\s*<CoreServices/", "// #include <CoreServices/", c)
                      c = re.sub(r"#\s*include\s*<IOKit/", "// #include <IOKit/", c)
                      c = c.replace("NXEventHandle", "void*")
                      with open(fpath, "w", encoding="utf-8") as f:
                          f.write(c)

          if os.path.exists("api/boinc_api.cpp"):
              with open("api/boinc_api.cpp", "r", encoding="utf-8", errors="ignore") as f:
                  c = f.read()
              
              old_finish = "int boinc_finish(int status) {"
              new_finish = """#ifdef __cplusplus
              extern "C" {
              #endif
              __attribute__((weak)) void nebula_force_exit(int status);
              #ifdef __cplusplus
              }
              #endif
              int boinc_finish(int status) {
                  fprintf(stderr, "[Nebula-Dylib] Intercepted boinc_finish(%d) -> Direct Escape!\\n", status);
                  fflush(stderr);
                  if (nebula_force_exit) {
                      nebula_force_exit(status);
                  }
                  exit(status);
              """
              if old_finish in c:
                  c = c.replace(old_finish, new_finish, 1)
              
              old_frac = "int boinc_fraction_done(double x) {"
              new_frac = """#ifdef __cplusplus
              extern "C" {
              #endif
              __attribute__((weak)) void nebula_direct_progress(double x);
              #ifdef __cplusplus
              }
              #endif
              int boinc_fraction_done(double x) {
                  if (nebula_direct_progress) nebula_direct_progress(x);
              """
              if old_frac in c:
                  c = c.replace(old_frac, new_frac, 1)
              with open("api/boinc_api.cpp", "w", encoding="utf-8") as f:
                  f.write(c)
          '
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          ./_autosetup
          ./configure \
            --host=arm-apple-darwin \
            --disable-server \
            --disable-client \
            --disable-manager \
            --enable-libraries \
            --disable-shared \
            --enable-static \
            CFLAGS="-O3 -mcpu=apple-a17 -target arm64-apple-ios27.0 -isysroot $IOS_SDK -flto=thin -falign-functions=128 -Wno-error" \
            CXXFLAGS="-O3 -mcpu=apple-a17 -target arm64-apple-ios27.0 -isysroot $IOS_SDK -flto=thin -falign-functions=128 -Wno-error"
          make -C lib -j$(sysctl -n hw.ncpu)
          make -C api -j$(sysctl -n hw.ncpu)

      - name: Configure MilkyWay CMake for dylib (Apple Native GCD Integration)
        run: |
          cd "$GITHUB_WORKSPACE/source"
          sed -i '' 's/cmake_minimum_required(VERSION [0-9.]*)/cmake_minimum_required(VERSION 3.5)/g' CMakeLists.txt
          sed -i '' 's/message(FATAL_ERROR.*OS X SDK.*/# bypass ancient sdk check/g' cmake_modules/SpecialLibs.cmake

          cat << 'PYEOF' > patch_nbody.py
          import os
          ws = os.environ['GITHUB_WORKSPACE']
          fpath_grav = os.path.join(ws, 'source/nbody/src/nbody_grav.c')

          with open(fpath_grav, 'r', encoding='utf-8') as f:
              cg = f.read()

          # Apple 純正 GCD & QoS ヘッダーを注入
          headers_to_add = "#include <dispatch/dispatch.h>\n#include <pthread/qos.h>\n"
          if '#include <dispatch/dispatch.h>' not in cg:
              cg = headers_to_add + cg

          start_marker = "static inline void nbMapForceBody(const NBodyCtx* ctx, NBodyState* st)"
          end_marker = "static mwvector nbGravity_Exact"

          pos1 = cg.find(start_marker)
          pos2 = cg.find(end_marker)

          if pos1 == -1 or pos2 == -1:
              print(">>> [FATAL ERROR] Markers not found in nbody_grav.c!")
              exit(1)

          new_func = [
              "static inline void nbMapForceBody(const NBodyCtx* ctx, NBodyState* st)",
              "{",
              "    const int nbody = st->nbody;",
              "    mwvector LMCx = ZERO_VECTOR;",
              "    real lmcmass, lmcscale, lmcscale2;",
              "    int lmcfunction;",
              "    const Body* bodies = mw_assume_aligned(st->bodytab, 16);",
              "    mwvector* accels = mw_assume_aligned(st->acctab, 16);",
              "    real curTime = st->step * ctx->timestep;",
              "    real timeFromStart __attribute__((unused)) = (-1)*ctx->Ntsteps*ctx->timestep + curTime;",
              "    real barTime = st->step * ctx->timestep - st->previousForwardTime;",
              "    if (ctx->LMC) {",
              "        lmcfunction = round(ctx->LMCfunction);",
              "        LMCx = st->LMCpos;",
              "        lmcmass = ctx->LMCmass;",
              "        lmcscale = ctx->LMCscale;",
              "        lmcscale2 = ctx->LMCscale2;",
              "    } else {",
              "        SET_VECTOR(LMCx, 0.0, 0.0, 0.0);",
              "        lmcfunction = 1;",
              "        lmcmass = 0.0;",
              "        lmcscale = 1.0;",
              "        lmcscale2 = 1.0;",
              "    }",
              "    /* Apple 純正 GCD dispatch_apply による完全安全 2 コア並列化 */",
              "    dispatch_apply(2, dispatch_get_global_queue(QOS_CLASS_USER_INITIATED, 0), ^(size_t thread_id) {",
              "        pthread_set_qos_class_self_np(QOS_CLASS_USER_INITIATED, 0);",
              "        int chunk = nbody / 2;",
              "        int start_i = (int)thread_id * chunk;",
              "        int end_i = (thread_id == 1) ? nbody : chunk;",
              "        for (int i = start_i; i < end_i; ++i) {",
              "            switch (ctx->potentialType) {",
              "                case EXTERNAL_POTENTIAL_DEFAULT: {",
              "                    const Body* b = &bodies[i];",
              "                    mwvector a = nbGravity(ctx, st, b);",
              "                    mwvector externAcc = mw_addv(nbExtAcceleration(&ctx->pot, Pos(b), barTime),",
              "                                                 LMCAcceleration(lmcfunction, Pos(b), LMCx, lmcmass, lmcscale, lmcscale2));",
              "                    mw_incaddv(a, externAcc);",
              "                    accels[i] = a;",
              "                    break;",
              "                }",
              "                case EXTERNAL_POTENTIAL_NONE: {",
              "                    accels[i] = nbGravity(ctx, st, &bodies[i]);",
              "                    break;",
              "                }",
              "                case EXTERNAL_POTENTIAL_CUSTOM_LUA: {",
              "                    mwvector a = nbGravity(ctx, st, &bodies[i]);",
              "                    mwvector externAcc = ZERO_VECTOR;",
              "                    nbEvalPotentialClosure(st, Pos(&bodies[i]), &externAcc);",
              "                    mw_incaddv(externAcc, LMCAcceleration(lmcfunction, Pos(&bodies[i]), LMCx, lmcmass, lmcscale, lmcscale2));",
              "                    mw_incaddv(a, externAcc);",
              "                    accels[i] = a;",
              "                    break;",
              "                }",
              "                default:",
              "                    mw_fail(\"Bad external potential type: %d\\n\", ctx->potentialType);",
              "            }",
              "        }",
              "    });",
              "}",
              "",
              ""
          ]

          cg = cg[:pos1] + "\n".join(new_func) + cg[pos2:]
          with open(fpath_grav, 'w', encoding='utf-8') as f:
              f.write(cg)
          print('>>> [SUCCESS] nbody_grav.c patched with Apple Native GCD & QoS!')

          # ① 矮小銀河の軌道逆積分の進捗 ＆ 中止/一時停止フック
          fpath_orb = os.path.join(ws, 'source/nbody/src/nbody_orbit_integrator.c')
          with open(fpath_orb, 'r', encoding='utf-8') as f:
              c = f.read()
          for pattern in ['while (t < t_end)', 'while (t > t_end)']:
              if pattern in c:
                  pos = c.find(pattern)
                  brace_pos = c.find('{', pos)
                  if brace_pos != -1:
                      inject = "\nstatic int step_cnt = 0;\n#ifdef __cplusplus\nextern \"C\"\n#endif\n__attribute__((weak)) void nebula_direct_progress(double x);\nif (nebula_direct_progress) nebula_direct_progress(-1.0);\nif (++step_cnt % 500 == 0) {\nfprintf(stderr, \"[Preprocess-Orbit] 矮小銀河の軌道を逆積分中...\\n\");\nfflush(stderr);\n}\n"
                      c = c[:brace_pos+1] + inject + c[brace_pos+1:]
                      with open(fpath_orb, 'w', encoding='utf-8') as f:
                          f.write(c)
                      print('>>> [SUCCESS] orbit integrator patched!')
                      break

          # ② 11万体の星の生成進捗
          fpath_body = os.path.join(ws, 'source/nbody/src/nbody.c')
          with open(fpath_body, 'r', encoding='utf-8') as f:
              c2 = f.read()
          for pattern in ['for (i = 0; i < n_bodies; i++)', 'for (i = 0; i < n_bodies; ++i)', 'for (int i = 0; i < n_bodies; i++)']:
              if pattern in c2:
                  pos = c2.find(pattern)
                  brace_pos = c2.find('{', pos)
                  if brace_pos != -1:
                      inject = "\nif (i % 20000 == 0) {\nfprintf(stderr, \"[Preprocess-Bodies] 天体データ生成中... (%d / %d 体)\\n\", (int)i, (int)n_bodies);\nfflush(stderr);\n}\n"
                      c2 = c2[:brace_pos+1] + inject + c2[brace_pos+1:]
                      with open(fpath_body, 'w', encoding='utf-8') as f:
                          f.write(c2)
                      print('>>> [SUCCESS] body generator patched!')
                      break

          # ③ Lua の system() コール無効化
          fpath_lua = os.path.join(ws, 'source/lua/src/loslib.c')
          with open(fpath_lua, 'r', encoding='utf-8') as f:
              c3 = f.read()
          c3 = c3.replace('system(luaL_optstring(L, 1, NULL))', '-1')
          with open(fpath_lua, 'w', encoding='utf-8') as f:
              f.write(c3)

          # ④ main() のエクスポート名変更
          fpath_main = os.path.join(ws, 'source/nbody/src/main.c')
          with open(fpath_main, 'r', encoding='utf-8') as f:
              m = f.read()
          m = m.replace('int main(int argc, char **argv)', '__attribute__((visibility("default"))) int milkyway_nbody_entry(int argc, char **argv)')
          m = m.replace('int main(int argc, char *argv[])', '__attribute__((visibility("default"))) int milkyway_nbody_entry(int argc, char **argv)')
          with open(fpath_main, 'w', encoding='utf-8') as f:
              f.write(m)
          print('>>> [SUCCESS] main renamed!')
          PYEOF

          python3 patch_nbody.py

          sed -i '' 's/add_executable(\s*milkyway_nbody/add_library(milkyway_nbody SHARED/g' "$GITHUB_WORKSPACE/source/nbody/CMakeLists.txt"
          sed -i '' 's/add_executable(\s*\${NBODY_BIN_NAME}/add_library(\${NBODY_BIN_NAME} SHARED/g' "$GITHUB_WORKSPACE/source/nbody/CMakeLists.txt"

          rm -rf build && mkdir -p build && cd build
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CLANG_PERMISSIVE="-Wno-incompatible-function-pointer-types -Wno-int-conversion -Wno-implicit-function-declaration -Wno-deprecated-non-prototype -Wno-error"
          
          # A17 Pro ネイティブ最適化（Blocks 有効化・アラインメント整合）
          A17_ARCH="-O3 -mcpu=apple-a17 -target arm64-apple-ios27.0 -isysroot $IOS_SDK -fblocks -falign-functions=128 -falign-loops=32"
          A17_PRECISION="-fno-math-errno -fno-trapping-math -ffp-contract=fast"
          A17_SIMD="-fvectorize -fslp-vectorize -funroll-loops -fstrict-aliasing"
          A17_FLAGS="$A17_ARCH $A17_PRECISION $A17_SIMD -flto=thin"

          cmake .. \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_OSX_SYSROOT="$IOS_SDK" \
            -DBOINC_DIR=../boinc/boinc \
            -DBOINC_APPLICATION=ON \
            -DNBODY=ON \
            -DSEPARATION=OFF \
            -DNBODY_OPENMP=OFF \
            -DNBODY_GL=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="$A17_FLAGS $CLANG_PERMISSIVE" \
            -DCMAKE_CXX_FLAGS="$A17_FLAGS $CLANG_PERMISSIVE"

      - name: Build MilkyWay N-Body dylib
        run: |
          cd "$GITHUB_WORKSPACE/source/build"
          find . -name "link.txt" | while read -r linkfile; do
            sed -i '' 's/-Wl,--start-group//g' "$linkfile"
            sed -i '' 's/-Wl,--end-group//g' "$linkfile"
            sed -i '' 's/-libstdc++//g' "$linkfile"
            sed -i '' 's/-static//g' "$linkfile"
            
            if ! grep -q "/ar " "$linkfile"; then
              sed -i '' 's/$/ -Wl,-undefined,dynamic_lookup/g' "$linkfile"
            fi
          done
          make -j$(sysctl -n hw.ncpu) || make VERBOSE=1
          echo "=== Built dylib Info ==="
          DYLIB_FILE=$(find . -name "*milkyway_nbody*.dylib" | head -n 1)
          ls -lh "$DYLIB_FILE"
          file "$DYLIB_FILE"
          dwarfdump -u "$DYLIB_FILE" || otool -l "$DYLIB_FILE" | grep -A 2 LC_UUID
      - name: Upload A17 Pro dylib
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: milkyway_nbody_a17pro_dylib
          path: |
            source/build/**/*milkyway_nbody*.dylib
