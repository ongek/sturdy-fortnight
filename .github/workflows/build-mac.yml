name: Build MilkyWay macOS Native

on:
  push:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: macos-26  # ご指定の macOS 26 ランナー
    steps:
      - name: Show System Info & Clang Version
        run: |
          uname -a
          arch
          clang --version

      - name: Install Dependencies
        run: |
          brew install libomp cmake autoconf automake libtool

      - name: Configure Git for Legacy Submodules
        run: |
          git config --global url."https://".insteadOf git://

      - name: Clone MilkyWay@home Source
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/Milkyway-at-home/milkywayathome_client.git source

      - name: Build BOINC Libraries (arm64)
        run: |
          cd source/boinc/boinc
          mkdir -p "$HOME/bin"
          ln -sf "$(which glibtoolize)" "$HOME/bin/libtoolize"
          export PATH="$HOME/bin:$PATH"

          ./_autosetup
          ./configure \
            --disable-server \
            --disable-client \
            --disable-manager \
            --enable-libraries \
            --disable-shared \
            --enable-static \
            CFLAGS="-O3 -arch arm64 -Wno-error" \
            CXXFLAGS="-O3 -arch arm64 -Wno-error"

          make -C lib -j$(sysctl -n hw.ncpu)
          make -C api -j$(sysctl -n hw.ncpu)

      - name: Configure & Patch MilkyWay CMake (M4 Optimized)
        run: |
          cd source

          # 1. CMake 4.x の「古いCMake互換切り捨てエラー」をパッチで回避
          sed -i '' 's/cmake_minimum_required(VERSION [0-9.]*)/cmake_minimum_required(VERSION 3.5)/g' CMakeLists.txt

          mkdir -p build && cd build

          # 2. READMEの公式フラグとM4最適化フラグを注入して構成
          cmake .. \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DBOINC_DIR=../boinc/boinc \
            -DBOINC_APPLICATION=ON \
            -DNBODY=ON \
            -DSEPARATION=OFF \
            -DNBODY_OPENMP=ON \
            -DNBODY_GL=OFF \
            -DOpenMP_ROOT=/opt/homebrew/opt/libomp \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-O3 -mcpu=apple-m4 -Wno-error -I/opt/homebrew/opt/libomp/include" \
            -DCMAKE_CXX_FLAGS="-O3 -mcpu=apple-m4 -Wno-error -I/opt/homebrew/opt/libomp/include"

          # 3. macOSリンカーが即死する「-static」指定を生成ファイルから全自動除去
          find . -name "link.txt" -exec sed -i '' 's/-static//g' {} + 2>/dev/null || true

      - name: Compile & Link N-body
        run: |
          cd source/build

          # 念のため再度 link.txt から -static を削ってからビルド
          find . -name "link.txt" -exec sed -i '' 's/-static//g' {} + 2>/dev/null || true

          make -j$(sysctl -n hw.ncpu)

          echo "=== Built Binaries ==="
          ls -lh bin/* || ls -lh nbody/* || ls -lh *milkyway*

      - name: Upload Native Binary
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: milkyway_nbody_m4
          path: |
            source/build/bin/
            source/build/nbody/
