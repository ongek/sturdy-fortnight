name: Build MilkyWay macOS Native

on:
  push:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: macos-26
    steps:
      - name: Show System Info & Clang Version
        run: |
          uname -a
          arch
          clang --version

      - name: Install Dependencies
        run: |
          brew install libomp cmake autoconf automake libtool

      - name: Configure Git for Legacy Submodules
        run: |
          git config --global url."https://".insteadOf git://

      - name: Clone MilkyWay@home Source
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/Milkyway-at-home/milkywayathome_client.git source

      - name: Build BOINC Libraries (arm64)
        run: |
          cd source/boinc/boinc
          mkdir -p "$HOME/bin"
          ln -sf "$(which glibtoolize)" "$HOME/bin/libtoolize"
          export PATH="$HOME/bin:$PATH"

          ./_autosetup
          ./configure \
            --disable-server \
            --disable-client \
            --disable-manager \
            --enable-libraries \
            --disable-shared \
            --enable-static \
            CFLAGS="-O3 -arch arm64 -Wno-error" \
            CXXFLAGS="-O3 -arch arm64 -Wno-error"

          make -C lib -j$(sysctl -n hw.ncpu)
          make -C api -j$(sysctl -n hw.ncpu)

      - name: Configure & Patch MilkyWay CMake (M4 Optimized)
        run: |
          cd source
          sed -i '' 's/cmake_minimum_required(VERSION [0-9.]*)/cmake_minimum_required(VERSION 3.5)/g' CMakeLists.txt
          sed -i '' 's/message(FATAL_ERROR.*OS X SDK.*/# bypass ancient sdk check/g' cmake_modules/SpecialLibs.cmake

          mkdir -p build && cd build
          SYSROOT=$(xcrun --show-sdk-path)
          CLANG_PERMISSIVE="-Wno-incompatible-function-pointer-types -Wno-int-conversion -Wno-implicit-function-declaration -Wno-deprecated-non-prototype -Wno-error"

          cmake .. \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_POLICY_DEFAULT_CMP0074=NEW \
            -DCMAKE_OSX_SYSROOT="$SYSROOT" \
            -DBOINC_DIR=../boinc/boinc \
            -DBOINC_APPLICATION=ON \
            -DNBODY=ON \
            -DSEPARATION=OFF \
            -DNBODY_OPENMP=ON \
            -DNBODY_GL=OFF \
            -DOpenMP_ROOT=/opt/homebrew/opt/libomp \
            -DOpenMP_C_FLAGS="-Xpreprocessor -fopenmp -I/opt/homebrew/opt/libomp/include" \
            -DOpenMP_CXX_FLAGS="-Xpreprocessor -fopenmp -I/opt/homebrew/opt/libomp/include" \
            -DOpenMP_C_LIB_NAMES="omp" \
            -DOpenMP_CXX_LIB_NAMES="omp" \
            -DOpenMP_omp_LIBRARY=/opt/homebrew/opt/libomp/lib/libomp.dylib \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-O3 -mcpu=apple-m4 -I/opt/homebrew/opt/libomp/include $CLANG_PERMISSIVE" \
            -DCMAKE_CXX_FLAGS="-O3 -mcpu=apple-m4 -I/opt/homebrew/opt/libomp/include $CLANG_PERMISSIVE"

      - name: Compile & Link N-body (with link.txt Surgery)
        run: |
          cd source/build

          # 1. コンパイル実行（98%まで進める）
          make -j$(sysctl -n hw.ncpu) || true

          # 2. 【外科手術】生成された link.txt から macOS非互換オプションを完全除去
          TARGET_LINK="nbody/CMakeFiles/milkyway_nbody.dir/link.txt"
          if [ -f "$TARGET_LINK" ]; then
            echo "=== Patching $TARGET_LINK ==="
            # Linux専用の start-group / end-group を消去
            sed -i '' 's/-Wl,--start-group//g; s/-Wl,--end-group//g; s/--start-group//g; s/--end-group//g' "$TARGET_LINK"
            # 存在しない libstdc++ / static フラグを消去
            sed -i '' 's/-libstdc++//g; s/-static//g' "$TARGET_LINK"
            # OpenMPライブラリ（-lomp）を末尾に確実に注入
            sed -i '' 's|$| -L/opt/homebrew/opt/libomp/lib -lomp|' "$TARGET_LINK"
            
            echo "Patched link command:"
            cat "$TARGET_LINK"
            echo ""
            
            # 3. 調律したリンクコマンドを直接実行！
            echo "=== Executing Patched Link Command ==="
            (cd nbody && bash -c "$(cat CMakeFiles/milkyway_nbody.dir/link.txt)")
          fi

          # 4. 最終確認
          echo "=== Built Binaries ==="
          ls -lh bin/* || ls -lh nbody/* || ls -lh *milkyway* || true
          file bin/milkyway_nbody || file nbody/milkyway_nbody || true

      - name: Upload Native Binary
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: milkyway_nbody_m4_macos
          path: |
            source/build/bin/
            source/build/nbody/
