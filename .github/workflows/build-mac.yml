name: Build MilkyWay A17 Pro iOS Native

on:
  push:
  workflow_dispatch:

jobs:
  build-a17pro:
    runs-on: macos-26
    steps:
      - name: Show System Info & Clang Version
        run: |
          uname -a
          clang --version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install Dependencies
        run: |
          brew install cmake autoconf automake libtool

      - name: Configure Git for Legacy Submodules
        run: |
          git config --global url."https://".insteadOf git://

      - name: Clone MilkyWay@home Source
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/Milkyway-at-home/milkywayathome_client.git source

      - name: Build BOINC Libraries (iOS arm64)
        run: |
          cd source/boinc/boinc
          mkdir -p "$HOME/bin"
          ln -sf "$(which glibtoolize)" "$HOME/bin/libtoolize"
          export PATH="$HOME/bin:$PATH"

          # 【最上行マクロ強制注入パッチ】
          python3 -c "
          import os

          # 1. diagnostics.cpp と filesys.cpp の1行目にマクロを強制注入
          patches = {
              'lib/diagnostics.cpp': '#define PrintBacktrace() ((void)0)\n',
              'lib/filesys.cpp': '#define callPosixSpawn(x) (-1)\n'
          }

          for rel_path, macro in patches.items():
              if os.path.exists(rel_path):
                  with open(rel_path, 'r', encoding='utf-8', errors='ignore') as f:
                      content = f.read()
                  with open(rel_path, 'w', encoding='utf-8') as f:
                      f.write(macro + content)
                  print(f'Successfully injected macro into {rel_path}')
              else:
                  print(f'Warning: {rel_path} not found!')

          # 2. 全ファイルのiOS非対応ヘッダーを安全にコメントアウト
          for root, dirs, files in os.walk('.'):
              for file in files:
                  if file.endswith(('.cpp', '.c', '.h')):
                      fpath = os.path.join(root, file)
                      with open(fpath, 'r', encoding='utf-8', errors='ignore') as f:
                          c = f.read()
                      c = c.replace('#include <Carbon/', '// #include <Carbon/')
                      c = c.replace('#include <CoreServices/', '// #include <CoreServices/')
                      c = c.replace('#include <IOKit/', '// #include <IOKit/')
                      c = c.replace('NXEventHandle', 'void*')
                      with open(fpath, 'w', encoding='utf-8') as f:
                          f.write(c)
          "

          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)

          ./_autosetup
          ./configure \
            --host=arm-apple-darwin \
            --disable-server \
            --disable-client \
            --disable-manager \
            --enable-libraries \
            --disable-shared \
            --enable-static \
            CFLAGS="-O3 -target arm64-apple-ios16.0 -isysroot $IOS_SDK -flto=thin -Wno-error" \
            CXXFLAGS="-O3 -target arm64-apple-ios16.0 -isysroot $IOS_SDK -flto=thin -Wno-error"

          make -C lib -j$(sysctl -n hw.ncpu)
          make -C api -j$(sysctl -n hw.ncpu)

      - name: Configure MilkyWay CMake (A17 Pro iOS Native)
        run: |
          cd source
          sed -i '' 's/cmake_minimum_required(VERSION [0-9.]*)/cmake_minimum_required(VERSION 3.5)/g' CMakeLists.txt
          sed -i '' 's/message(FATAL_ERROR.*OS X SDK.*/# bypass ancient sdk check/g' cmake_modules/SpecialLibs.cmake

          mkdir -p build && cd build
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CLANG_PERMISSIVE="-Wno-incompatible-function-pointer-types -Wno-int-conversion -Wno-implicit-function-declaration -Wno-deprecated-non-prototype -Wno-error"

          # 【A17 Pro 全力最適化フラグ (シングルスレッド高密度版)】
          A17_OPT="-O3 -mcpu=apple-a17 -target arm64-apple-ios16.0 -isysroot $IOS_SDK -flto=thin -falign-functions=128 -ffp-contract=fast -fno-math-errno"

          cmake .. \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_OSX_SYSROOT="$IOS_SDK" \
            -DBOINC_DIR=../boinc/boinc \
            -DBOINC_APPLICATION=ON \
            -DNBODY=ON \
            -DSEPARATION=OFF \
            -DNBODY_OPENMP=OFF \
            -DNBODY_GL=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="$A17_OPT $CLANG_PERMISSIVE" \
            -DCMAKE_CXX_FLAGS="$A17_OPT $CLANG_PERMISSIVE"

      - name: Build MilkyWay N-Body (with Linker Sanitization)
        run: |
          cd source/build

          # 【地雷7 外科手術】Linux専用リンカーオプションを根絶
          find . -name "link.txt" | while read -r linkfile; do
            sed -i '' 's/-Wl,--start-group//g' "$linkfile"
            sed -i '' 's/-Wl,--end-group//g' "$linkfile"
            sed -i '' 's/-libstdc++//g' "$linkfile"
            sed -i '' 's/-static//g' "$linkfile"
          done

          # 本番コンパイル＆リンク
          make -j$(sysctl -n hw.ncpu)

          # バイナリのアーキテクチャ・署名・依存関係チェック
          echo "=== Built Binary Info ==="
          ls -lh bin/milkyway_nbody
          file bin/milkyway_nbody
          otool -L bin/milkyway_nbody

      - name: Upload A17 Pro Binary
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: milkyway_nbody_a17pro_ios
          path: |
            source/build/bin/milkyway_nbody
