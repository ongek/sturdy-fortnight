name: Build MilkyWay A17 Pro iOS Native

on:
  push:
  workflow_dispatch:

jobs:
  build-a17pro:
    runs-on: xcode-27
    steps:
      - name: Show System Info & Clang Version
        run: |
          uname -a
          clang --version
          xcrun --sdk iphoneos --show-sdk-path
      - name: Install Dependencies
        run: |
          brew install cmake autoconf automake libtool
      - name: Configure Git for Legacy Submodules
        run: |
          git config --global url."https://".insteadOf git://
      - name: Clone MilkyWay@home Source
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/Milkyway-at-home/milkywayathome_client.git source
      
      - name: Build BOINC Libraries (iOS arm64 tuned for A17 Pro)
        run: |
          cd source/boinc/boinc
          mkdir -p "$HOME/bin"
          ln -sf "$(which glibtoolize)" "$HOME/bin/libtoolize"
          export PATH="$HOME/bin:$PATH"
          
          # 【リンケージ整合パッチ】callPosixSpawnをC++リンケージとして定義
          python3 -c "
          import os
          dummy_code = '''
          #include <stdio.h>
          #include <stdlib.h>
          int callPosixSpawn(const char* cmd) { (void)cmd; return -1; }
          #ifdef __cplusplus
          extern \"C\" {
          #endif
              void PrintBacktrace(void) {}
              int compareOSVersionTo(int major, int minor, int bugFix) { 
                  (void)major; (void)minor; (void)bugFix; return 0; 
              }
          #ifdef __cplusplus
          }
          #endif
          '''
          for root, dirs, files in os.walk('.'):
              for file in files:
                  fpath = os.path.join(root, file)
                  if '/mac/' in fpath or fpath.startswith('./mac/'):
                      if file.endswith(('.cpp', '.c', '.m', '.mm')):
                          with open(fpath, 'w', encoding='utf-8') as f:
                              f.write(dummy_code)
          if os.path.exists('lib/procinfo_mac.cpp'):
              with open('lib/procinfo_mac.cpp', 'a', encoding='utf-8') as f:
                  f.write('\nchar *brandName[5] = {(char*)\"BOINC\", (char*)\"BOINC\", (char*)\"BOINC\", (char*)\"BOINC\", (char*)\"BOINC\"};\n')
          if os.path.exists('lib/diagnostics.cpp'):
              with open('lib/diagnostics.cpp', 'r', encoding='utf-8', errors='ignore') as f:
                  d_content = f.read()
              d_content = d_content.replace('PrintBacktrace();', '// PrintBacktrace();')
              with open('lib/diagnostics.cpp', 'w', encoding='utf-8') as f:
                  f.write(d_content)
          for root, dirs, files in os.walk('.'):
              for file in files:
                  if file.endswith(('.cpp', '.c', '.h')):
                      fpath = os.path.join(root, file)
                      with open(fpath, 'r', encoding='utf-8', errors='ignore') as f:
                          c = f.read()
                      c = c.replace('#include <Carbon/', '// #include <Carbon/')
                      c = c.replace('#include <CoreServices/', '// #include <CoreServices/')
                      c = c.replace('#include <IOKit/', '// #include <IOKit/')
                      c = c.replace('NXEventHandle', 'void*')
                      with open(fpath, 'w', encoding='utf-8') as f:
                          f.write(c)
          "

          # ====================================================================
          # ★【持病の完全根治パッチ】
          # boinc_finish が呼ばれたら余計なスレッドjoinをせず即座に exit(0) させる
          # これで Swift側の exit() フックを経由して longjmp で瞬時に帰還します
          # ====================================================================
          python3 -c "
          import os
          fpath = 'api/boinc_api.cpp'
          if os.path.exists(fpath):
              with open(fpath, 'r', encoding='utf-8', errors='ignore') as f:
                  c = f.read()
              old_str = 'int boinc_finish(int status) {'
              new_str = '''int boinc_finish(int status) {
                  fprintf(stderr, \"[Nebula-Dylib] Intercepted boinc_finish(%d) -> Force Clean Exit\\\\n\", status);
                  fflush(stderr);
                  exit(status);
              '''
              if old_str in c:
                  c = c.replace(old_str, new_str, 1)
                  with open(fpath, 'w', encoding='utf-8') as f:
                      f.write(c)
                  print('>>> [SUCCESS] Patched boinc_finish in boinc_api.cpp!')
              else:
                  print('>>> [WARNING] Could not find boinc_finish signature!')
          "

          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          ./_autosetup
          ./configure \
            --host=arm-apple-darwin \
            --disable-server \
            --disable-client \
            --disable-manager \
            --enable-libraries \
            --disable-shared \
            --enable-static \
            CFLAGS="-O3 -mcpu=apple-a17 -target arm64-apple-ios16.0 -isysroot $IOS_SDK -flto=thin -falign-functions=128 -Wno-error" \
            CXXFLAGS="-O3 -mcpu=apple-a17 -target arm64-apple-ios16.0 -isysroot $IOS_SDK -flto=thin -falign-functions=128 -Wno-error"
          make -C lib -j$(sysctl -n hw.ncpu)
          make -C api -j$(sysctl -n hw.ncpu)

      - name: Configure MilkyWay CMake for dylib (A17 Pro Extreme Tuning)
        run: |
          cd source
          sed -i '' 's/cmake_minimum_required(VERSION [0-9.]*)/cmake_minimum_required(VERSION 3.5)/g' CMakeLists.txt
          sed -i '' 's/message(FATAL_ERROR.*OS X SDK.*/# bypass ancient sdk check/g' cmake_modules/SpecialLibs.cmake
          
          # 1. Lua の system() 呼出を無害化
          python3 -c "
          import os
          fpath = 'lua/src/loslib.c'
          if os.path.exists(fpath):
              with open(fpath, 'r', encoding='utf-8', errors='ignore') as f:
                  c = f.read()
              c = c.replace('system(luaL_optstring(L, 1, NULL))', '-1')
              with open(fpath, 'w', encoding='utf-8') as f:
                  f.write(c)
          "

          # 2. CMakeを実行ファイルからdylibに変更
          sed -i '' 's/add_executable(\s*milkyway_nbody/add_library(milkyway_nbody SHARED/g' nbody/CMakeLists.txt
          sed -i '' 's/add_executable(\s*\${NBODY_BIN_NAME}/add_library(\${NBODY_BIN_NAME} SHARED/g' nbody/CMakeLists.txt
          
          # 3. main関数を確実に外部公開
          python3 -c "
          import os
          mpath = 'nbody/src/main.c'
          if os.path.exists(mpath):
              with open(mpath, 'r', encoding='utf-8', errors='ignore') as f:
                  c = f.read()
              c = c.replace('int main(int argc, char **argv)', '__attribute__((visibility(\"default\"))) int milkyway_nbody_entry(int argc, char **argv)')
              c = c.replace('int main(int argc, char *argv[])', '__attribute__((visibility(\"default\"))) int milkyway_nbody_entry(int argc, char **argv)')
              with open(mpath, 'w', encoding='utf-8') as f:
                  f.write(c)
              print('Successfully renamed main() to exported milkyway_nbody_entry()')
          "

          mkdir -p build && cd build
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)

          # ====================================================================
          # ★★★ A17 Pro アーキテクチャ特化＆精度絶対保証フラグ（AppleClang最適化版） ★★★
          # ====================================================================
          CLANG_PERMISSIVE="-Wno-incompatible-function-pointer-types -Wno-int-conversion -Wno-implicit-function-declaration -Wno-deprecated-non-prototype -Wno-error"
          
          # 1. 基本アーキテクチャ & Apple Silicon特有の128バイトキャッシュ整合
          A17_ARCH="-O3 -mcpu=apple-a17 -target arm64-apple-ios16.0 -isysroot $IOS_SDK -falign-functions=128 -falign-loops=32"
          
          # 2. 計算精度絶対保証（結合法則や除算近似を行わず、ハードウェア命令直結）
          A17_PRECISION="-fno-math-errno -fno-trapping-math -ffp-contract=fast"
          
          # 3. ループ展開＆インライン最適化（AppleClang正規フラグ）
          #    ・-funroll-loops: 4基のNEON/FPパイプラインを飽和させるアグレッシブなループアンローリング
          #    ・-inline-threshold=1500: A17 Proの巨大L1Iキャッシュ(192KB)を活かした積極インライン展開
          A17_OPT_FLAGS="-funroll-loops -mllvm -inline-threshold=1500"
          
          # 4. ThinLTO (リンク時最適化)
          A17_LTO="-flto=thin"

          A17_FULL_OPT="$A17_ARCH $A17_PRECISION $A17_OPT_FLAGS $A17_LTO"


          cmake .. \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_OSX_SYSROOT="$IOS_SDK" \
            -DBOINC_DIR=../boinc/boinc \
            -DBOINC_APPLICATION=ON \
            -DNBODY=ON \
            -DSEPARATION=OFF \
            -DNBODY_OPENMP=OFF \
            -DNBODY_GL=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="$A17_FULL_OPT $CLANG_PERMISSIVE" \
            -DCMAKE_CXX_FLAGS="$A17_FULL_OPT $CLANG_PERMISSIVE"

      - name: Build MilkyWay N-Body dylib
        run: |
          cd source/build
          find . -name "link.txt" | while read -r linkfile; do
            sed -i '' 's/-Wl,--start-group//g' "$linkfile"
            sed -i '' 's/-Wl,--end-group//g' "$linkfile"
            sed -i '' 's/-libstdc++//g' "$linkfile"
            sed -i '' 's/-static//g' "$linkfile"
          done
          make -j$(sysctl -n hw.ncpu) || make VERBOSE=1
          echo "=== Built dylib Info ==="
          DYLIB_FILE=$(find . -name "*milkyway_nbody*.dylib" | head -n 1)
          ls -lh "$DYLIB_FILE"
          file "$DYLIB_FILE"
          otool -L "$DYLIB_FILE"
          nm -gU "$DYLIB_FILE" | grep -E "(milkyway_nbody_entry|main)" || true

      - name: Upload A17 Pro dylib
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: milkyway_nbody_a17pro_dylib
          path: |
            source/build/**/*milkyway_nbody*.dylib
