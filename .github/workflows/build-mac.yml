name: Build MilkyWay macOS Native

on:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - name: Show System Info & Clang Version
        run: |
          uname -a
          arch
          clang --version

      - name: Install Dependencies
        run: |
          # BOINCビルドに必要な autoconf 等と OpenMP を導入
          brew install libomp cmake autoconf automake libtool

      - name: Configure Git for Legacy Submodules
        run: |
          git config --global url."https://".insteadOf git://

      - name: Clone MilkyWay@home Source
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/Milkyway-at-home/milkywayathome_client.git source

      - name: Build BOINC Libraries (arm64)
        run: |
          cd source/boinc/boinc
          
          # ビルドスクリプトの生成
          ./_autosetup
          
          # GUIやデーモンは不要。純粋なライブラリ（libboinc.a, libboinc_api.a）だけをARM64で構成
          ./configure \
            --disable-server \
            --disable-client \
            --disable-manager \
            --enable-libraries \
            --enable-boinczip \
            --disable-shared \
            --enable-static \
            CFLAGS="-O3 -arch arm64" \
            CXXFLAGS="-O3 -arch arm64"
          
          # 並列ビルド
          make -j$(sysctl -n hw.ncpu)
          
          # 成果物の存在確認
          echo "=== Built Libraries ==="
          ls -lh lib/.libs/libboinc.a api/.libs/libboinc_api.a || ls -lh lib/libboinc.a api/libboinc_api.a
